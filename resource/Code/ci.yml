name: CI Pipeline

on:
  push:
    branches: ['main', 'dev', 'feature/**', 'chore/**']
  pull_request:
    branches: ['main', 'dev']

jobs:
  backend-test:
    name: Backend Test (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Prepare Environment
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Backend Tests
        run: php artisan test

  frontend-build:
    name: Frontend Build (Vue.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure package-lock.json Exists
        run: if [ ! -f package-lock.json ]; then npm install --package-lock-only --no-audit --no-fund; fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
