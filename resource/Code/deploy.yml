name: Continuous Deployment

on:
  push:
    branches: ['main']

jobs:
  deploy:
    name: Deploy Docker Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secret Configuration
        run: |
          echo "Memverifikasi konfigurasi rahasia di GitHub Actions..."
          if [ -n "$APP_KEY" ]; then
            echo "[OK] Secret APP_KEY terkonfigurasi di GitHub Actions."
          else
            echo "::warning::Secret APP_KEY belum diisi di Settings -> Secrets and variables -> Actions."
          fi
          if [ -n "$DB_PASSWORD" ]; then
            echo "[OK] Secret DB_PASSWORD terkonfigurasi di GitHub Actions."
          else
            echo "::warning::Secret DB_PASSWORD belum diisi di Settings -> Secrets and variables -> Actions."
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Names and Commit Tag
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_TAG="${{ github.sha }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "BACKEND_IMAGE=ghcr.io/${REPO_OWNER}/uts-backend:${COMMIT_TAG}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_OWNER}/uts-frontend:${COMMIT_TAG}" >> $GITHUB_ENV
          echo "BACKEND_SHORT_IMAGE=ghcr.io/${REPO_OWNER}/uts-backend:${SHORT_SHA}" >> $GITHUB_ENV
          echo "FRONTEND_SHORT_IMAGE=ghcr.io/${REPO_OWNER}/uts-frontend:${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and Push Backend Docker Image
        run: |
          echo "Building backend Docker image with tag: ${{ github.sha }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Laravel 12 Backend API with FrankenPHP" \
            -t "${BACKEND_IMAGE}" \
            -t "${BACKEND_SHORT_IMAGE}" \
            -f backend/Dockerfile \
            backend
          echo "Pushing backend Docker image to GHCR..."
          docker push "${BACKEND_IMAGE}"
          docker push "${BACKEND_SHORT_IMAGE}"

      - name: Build and Push Frontend Docker Image
        run: |
          echo "Building frontend Docker image with tag: ${{ github.sha }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Vue 3 Frontend SPA with Nginx" \
            -t "${FRONTEND_IMAGE}" \
            -t "${FRONTEND_SHORT_IMAGE}" \
            -f frontend/Dockerfile \
            frontend
          echo "Pushing frontend Docker image to GHCR..."
          docker push "${FRONTEND_IMAGE}"
          docker push "${FRONTEND_SHORT_IMAGE}"
